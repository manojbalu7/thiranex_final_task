<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two-Factor Authentication | SecureShield</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      Secure<span>Shield</span> Auth
    </a>
    <div class="nav-links">
      <a href="/login.html" class="nav-link">Cancel & Return</a>
    </div>
  </nav>

  <main class="container">
    <div class="auth-container">
      <div class="card" style="text-align: center;">
        <div style="display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3); margin-bottom: 1.25rem;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
            <line x1="12" y1="18" x2="12.01" y2="18"/>
          </svg>
        </div>

        <h2 class="card-title">Two-Factor Authentication</h2>
        <p class="card-subtitle">Open your authenticator app (Google Authenticator, Authy, etc.) and enter your verification code.</p>

        <div id="verify-alert" class="alert"></div>

        <form id="verify-2fa-form">
          <div class="form-group">
            <label class="form-label" id="code-label" for="token-input" style="text-align: center;">6-Digit Authenticator Code</label>
            <input type="text" id="token-input" class="form-control" placeholder="000000" maxlength="6" style="text-align: center; font-size: 1.5rem; letter-spacing: 0.3em; font-family: monospace;" required autofocus autocomplete="one-time-code">
          </div>

          <button type="submit" id="verify-btn" class="btn btn-primary" style="margin-top: 1rem;">
            Verify Code
          </button>
        </form>

        <div style="margin-top: 1.5rem;">
          <a href="#" id="toggle-backup-mode" style="color: #38bdf8; font-size: 0.85rem; text-decoration: none;">
            Lost phone? Use an Emergency Backup Code
          </a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>Secure Login System &bull; RFC 6238 Time-based One-Time Password (TOTP)</p>
  </footer>

  <script src="/js/two-factor.js"></script>
</body>
</html>
