<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | SecureShield</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      Secure<span>Shield</span> Auth
    </a>
    <div class="nav-links">
      <a href="/register.html" class="nav-link">Register</a>
      <a href="/security-demo.html" class="nav-link">Security Demo</a>
    </div>
  </nav>

  <main class="container">
    <div class="auth-container">
      <div class="card">
        <h2 class="card-title">Welcome Back</h2>
        <p class="card-subtitle">Authenticate to access your protected session</p>

        <div id="auth-alert" class="alert"></div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="emailOrUsername">Email or Username</label>
            <input type="text" id="emailOrUsername" class="form-control" placeholder="john@example.com" required autofocus>
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
              <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
            </div>
            <input type="password" id="password" class="form-control" placeholder="••••••••••••" required>
          </div>

          <button type="submit" id="submit-btn" class="btn btn-primary" style="margin-top: 1rem;">
            Sign In
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #94a3b8;">
          Don't have an account yet? <a href="/register.html" style="color: #38bdf8; text-decoration: none; font-weight: 600;">Create one now</a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>Secure Login System &bull; Brute-Force Protected &bull; Bcrypt & 2FA</p>
  </footer>

  <script src="/js/auth.js"></script>
</body>
</html>
